<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Build Gallery</title>
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --ink: #1d1b18; --ink-2: #5d5850; --muted: #8d877d;
    --line: #e3dfd7; --accent: #2f6fb3; --good: #2e7d4f; --chip: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --surface: #1d1d1d; --ink: #ecebe8; --ink-2: #b4b0a8; --muted: #7d7970;
      --line: #2e2e2e; --accent: #6ea6e6; --good: #5cbf85; --chip: #262626; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); margin: 0 0 24px; max-width: 70ch; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .chart-panel { margin-bottom: 24px; position: relative; }
  .chart-panel h2, .card h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .chart-panel p { margin: 2px 0 8px; color: var(--muted); font-size: 12px; }
  #chart { width: 100%; height: 180px; display: block; }
  #tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px;
    padding: 4px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; gap: 10px; }
  .card header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .meta { color: var(--muted); font-size: 12px; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  canvas.view { width: 100%; aspect-ratio: 284 / 300; display: block; cursor: grab; touch-action: none; border-radius: 8px; background: var(--chip); }
  .controls { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 8px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--chip); padding: 4px 8px; border-radius: 6px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>

  <p class="sub">Houses generated by a PPO policy that places one block per cell. Drag a preview or press ↻ to rotate it, and use the slider to cut away upper layers and look inside. Run the command shown on each card in Minecraft to build it.</p>

    <p id="chartNote"></p>
    <svg id="chart" role="img" aria-label="Training score per iteration"></svg>
    <div id="tip"></div>
  </section>

  <section class="grid" id="grid"></section>
</main>

// ---------- training chart ----------
(function chart() {
  const log = DATA.log, svg = document.getElementById('chart'), panel = document.getElementById('chartPanel');
  if (!log.length) { panel.style.display = 'none'; return; }
  document.getElementById('chartNote').textContent = `${log.length} iterations · final ${log[log.length - 1].score}`;
  const cs = getComputedStyle(document.documentElement), css = { getPropertyValue: (k) => cs.getPropertyValue(k).trim() };
  const W = svg.clientWidth || 800, H = 180, L = 32, R = 12, T = 8, B = 22;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const xs = (i) => L + (i / Math.max(1, log.length - 1)) * (W - L - R);
  const ys = (v) => T + (1 - v / 100) * (H - T - B);
  let s = '';
  for (const v of [0, 50, 100]) s += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="${css.getPropertyValue('--line')}"/>` +
    `<text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="${css.getPropertyValue('--muted')}">${v}</text>`;
  s += `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="${css.getPropertyValue('--muted')}">iteration ${log.length}</text>`;
  s += `<polyline fill="none" stroke="${css.getPropertyValue('--accent')}" stroke-width="2" stroke-linejoin="round" points="${log.map((r, i) => `${xs(i)},${ys(r.score)}`).join(' ')}"/>`;
  s += `<line id="cross" y1="${T}" y2="${H - B}" stroke="${css.getPropertyValue('--muted')}" stroke-dasharray="3 3" opacity="0"/>`;
  s += `<circle id="dot" r="4" fill="${css.getPropertyValue('--accent')}" stroke="${css.getPropertyValue('--surface')}" stroke-width="2" opacity="0"/>`;
  svg.innerHTML = s;
  const tip = document.getElementById('tip'), cross = svg.querySelector('#cross'), dot = svg.querySelector('#dot');
  svg.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect(), px = (e.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(log.length - 1, Math.round(((px - L) / (W - L - R)) * (log.length - 1))));
    const r = log[i], x = xs(i), y = ys(r.score);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1);
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity', 1);
    tip.textContent = `iter ${r.iter} · score ${r.score} · return ${r.return} · door ok ${Math.round(r.doorRate * 100)}%`;
    tip.style.opacity = 1;
    const tx = (x / W) * rect.width + 16;
    tip.style.left = Math.min(tx, rect.width - tip.offsetWidth) + 'px';
    tip.style.top = ((y / H) * rect.height + 20) + 'px';
  });
  svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); });
})();

// ---------- isometric voxel renderer (web/render.js, inlined at export) ----------
// Isometric voxel renderer shared by the web app and the exported gallery.
// build: { grid: string of block digits, colors: [hex per block id] }

const RENDER_SIZE = [284, 300];

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(Math.min(255, v * f)));
  return `rgb(${c.join(',')})`;
}

function poly(ctx, pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

// rot: 0-3 quarter turns; slice: highest layer to draw (cutaway view).
function renderVoxels(canvas, build, dims, rot, slice) {
  const [GX, GY, GZ] = dims, [CW, CH] = RENDER_SIZE;
  const TW = 24, TH = 12, BH = 13;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CW * dpr; canvas.height = CH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  const S = GX; // square lot
  const rotXZ = (x, z) => [[x, z], [S - 1 - z, x], [S - 1 - x, S - 1 - z], [z, S - 1 - x]][rot];
  // Realism overrides: [cell, colour | null (removed), width, height] (src/realism.js decoFor).
  const deco = new Map((build.deco ?? []).map((d) => [d[0], d]));
  const cells = [];
  for (let y = 0; y < GY && y <= slice; y++) for (let z = 0; z < GZ; z++) for (let x = 0; x < GX; x++) {
    const i = (y * GZ + z) * GX + x;
    const [rx, rz] = rotXZ(x, z);
    const d = deco.get(i);
    if (d) {
      if (d[1]) cells.push({ x: rx, y, z: rz, col: d[1], w: d[2], h: d[3], glass: false, log: false });
      continue;
    }
    const v = +build.grid[i];
    if (v) cells.push({ x: rx, y, z: rz, col: build.colors[v], w: 1, h: 1, glass: v === 4, log: v === 3 });
  }
  if (!cells.length) return;
  const solid = new Set(cells.filter((c) => !c.glass && c.w === 1 && c.h === 1).map((c) => `${c.x},${c.y},${c.z}`));
  cells.sort((a, b) => a.x + a.y + a.z - (b.x + b.y + b.z) || a.y - b.y);
  // Centre the build's actual extent.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const { x, y, z } of cells) {
    const px = (x - z) * TW / 2, py = (x + z) * TH / 2 - y * BH;
    minX = Math.min(minX, px - TW / 2); maxX = Math.max(maxX, px + TW / 2);
    minY = Math.min(minY, py - TH / 2); maxY = Math.max(maxY, py + TH / 2 + BH);
  }
  const scale = Math.min(1.25, (CW - 24) / (maxX - minX), (CH - 24) / (maxY - minY));
  ctx.translate(CW / 2, CH / 2);
  ctx.scale(scale, scale);
  ctx.translate(-(minX + maxX) / 2, -(minY + maxY) / 2);
  for (const c of cells) {
    const { x, y, z, col } = c;
    // Smaller things (plants, lanterns, carpet) are scaled boxes standing on the cell floor.
    const tw = TW * c.w, th = TH * c.w, bh = BH * c.h;
    const sx = (x - z) * TW / 2, sy = (x + z) * TH / 2 - y * BH + (BH - bh);
    ctx.globalAlpha = c.glass ? 0.5 : 1;
    const full = c.w === 1 && c.h === 1;
    const top = !full || !solid.has(`${x},${y + 1},${z}`), right = !full || !solid.has(`${x + 1},${y},${z}`), left = !full || !solid.has(`${x},${y},${z + 1}`);
    if (top) poly(ctx, [[sx, sy - th / 2], [sx + tw / 2, sy], [sx, sy + th / 2], [sx - tw / 2, sy]], shade(col, 1.08));
    if (left) poly(ctx, [[sx - tw / 2, sy], [sx, sy + th / 2], [sx, sy + th / 2 + bh], [sx - tw / 2, sy + bh]], shade(col, 0.82));
    if (right) poly(ctx, [[sx + tw / 2, sy], [sx, sy + th / 2], [sx, sy + th / 2 + bh], [sx + tw / 2, sy + bh]], shade(col, 0.64));
    if (c.log && (left || right)) { // log bark lines
      ctx.strokeStyle = shade(col, 0.5);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx - TW / 4, sy + TH / 4 + 2); ctx.lineTo(sx - TW / 4, sy + TH / 4 + BH - 2);
      ctx.moveTo(sx + TW / 4, sy + TH / 4 + 2); ctx.lineTo(sx + TW / 4, sy + TH / 4 + BH - 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// Wire up a canvas with drag-to-rotate. Returns { draw, setSlice, rotate }.
function attachViewer(canvas, build, dims) {
  let rot = 2, slice = dims[1] - 1, dragX = null; // rot 2 = front (door) toward the viewer
  const draw = () => renderVoxels(canvas, build, dims, rot, slice);
  canvas.addEventListener('pointerdown', (e) => { dragX = e.clientX; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (dragX !== null && Math.abs(e.clientX - dragX) > 40) { rot = (rot + (e.clientX > dragX ? 1 : 3)) % 4; dragX = e.clientX; draw(); }
  });
  canvas.addEventListener('pointerup', () => { dragX = null; });
  draw();
  return {
    draw,
    rotate() { rot = (rot + 1) % 4; draw(); },
    setSlice(v) { slice = v; draw(); },
  };
}

function topLayer(build, dims) {
  const [GX, , GZ] = dims;
  let top = 0;
  for (let i = 0; i < build.grid.length; i++) if (build.grid[i] !== '0') top = Math.floor(i / (GX * GZ));
  for (const d of build.deco ?? []) if (d[1]) top = Math.max(top, Math.floor(d[0] / (GX * GZ)));
  return top;
}


// ---------- cards ----------
const grid = document.getElementById('grid');
const pct = (v) => Math.round(v * 100) + '%';
for (const b of DATA.builds) {
  const m = b.metrics;
  const top = topLayer(b, DATA.dims);
  const chips = [
    m.doors !== null && 'doors ' + m.doors, m.enclosure !== null && 'enclosed ' + pct(m.enclosure),
    m.windowRatio !== null && 'windows ' + pct(m.windowRatio), m.roofCoverage !== null && 'roof ' + pct(m.roofCoverage),
    m.symmetry !== null && 'symmetry ' + pct(m.symmetry), 'strays ' + m.strayBlocks, b.fell && 'physics: ' + b.fell + ' fell',
  ].filter(Boolean);
  const card = document.createElement('article');
  card.className = 'panel card';
  card.innerHTML = `
    <header><h2>${b.label} #${b.id} · ${b.w}×${b.d}${b.variant ? ' ' + b.variant + ' ' + b.variantLabel.toLowerCase() : ''}</h2><span class="score">${m.score}<span class="meta">/100</span></span></header>
    <div class="meta">${b.theme.replace(/^custom_.*/, 'your blocks')} theme${b.h ? ' · height ' + b.h : ''}</div>
    <canvas class="view" aria-label="Isometric preview of ${b.name}"></canvas>
    <div class="controls"><button class="rot" title="Rotate">↻</button><span>Layers</span><input type="range" min="0" max="${top}" value="${top}"><span class="lv">${top + 1}</span></div>
    <div class="chips">${chips.map((c) => '<span class="chip">' + c + '</span>').join('')}</div>
    <div class="cmd"><code>/function rlbuild:${b.name}</code><button class="copy">Copy</button></div>`;
  grid.appendChild(card);
  const slider = card.querySelector('input'), lv = card.querySelector('.lv');
  const viewer = attachViewer(card.querySelector('canvas'), b, DATA.dims);
  card.querySelector('.rot').onclick = () => viewer.rotate();
  slider.oninput = () => { lv.textContent = +slider.value + 1; viewer.setSlice(+slider.value); };
  card.querySelector('.copy').onclick = (e) => {
    navigator.clipboard?.writeText('/function rlbuild:' + b.name);
    e.target.textContent = 'Copied'; setTimeout(() => (e.target.textContent = 'Copy'), 1200);
  };
}
